# Fails require-team-label: requests a GPU but has no team label.
apiVersion: v1
kind: Pod
metadata:
  name: team-label-fail
  namespace: ml-team-a
  labels:
    app.kubernetes.io/part-of: policy-demo
spec:
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 1
