# Passes max-gpus-per-pod: requests 4 GPUs, what one node holds.
apiVersion: v1
kind: Pod
metadata:
  name: max-gpus-pass
  namespace: ml-team-a
  labels:
    app.kubernetes.io/part-of: policy-demo
    team: ml-team-a
spec:
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 4
