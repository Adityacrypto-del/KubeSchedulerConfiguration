# Passes require-team-label: requests a GPU and has a non-empty team label.
apiVersion: v1
kind: Pod
metadata:
  name: team-label-pass
  namespace: ml-team-a
  labels:
    app.kubernetes.io/part-of: policy-demo
    team: ml-team-a
spec:
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 1
