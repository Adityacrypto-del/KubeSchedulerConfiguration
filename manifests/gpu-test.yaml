# Test workload for KubeSchedulerConfiguration GPU bin-packing:
# 6 replicas that each need one (fake) nvidia.com/gpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-test
  labels:
    app: gpu-test
spec:
  replicas: 6
  selector:
    matchLabels:
      app: gpu-test
  template:
    metadata:
      labels:
        app: gpu-test
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              nvidia.com/gpu: 1
