# KubeSchedulerConfiguration gang scheduling demo.
# Partial-start demo, with gang scheduling: the same 4-pod trainer job, gated by
# a Workload/PodGroup with minCount 4. Apply after manifests/gpu-test.yaml.
---
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: trainer
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: trainer
spec:
  podGroupTemplates:
    - name: workers
      schedulingPolicy:
        gang:
          minCount: 4
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: trainer-workers
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: trainer
spec:
  workloadRef:
    workloadName: trainer
    templateName: workers
  schedulingPolicy:
    gang:
      minCount: 4
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer-0
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: trainer
spec:
  schedulingGroup:
    podGroupName: trainer-workers
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
---
