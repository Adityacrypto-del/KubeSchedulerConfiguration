# KubeSchedulerConfiguration gang scheduling demo.
# Partial-start demo, without gang scheduling: a 4-pod trainer job needing
# 8 GPUs (2 each), with no PodGroup reference. Apply after manifests/gpu-test.yaml.
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer-0
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: trainer
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
