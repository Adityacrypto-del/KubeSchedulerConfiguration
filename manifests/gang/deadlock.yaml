# KubeSchedulerConfiguration gang scheduling demo.
# Deadlock demo, without gang scheduling: job-a and job-b, 4 pods x 2 GPUs each
# (16 GPUs for 12 available). Pods are listed interleaved so kubectl apply
# creates them in the order a-0, b-0, a-1, b-1, ...
---
apiVersion: v1
kind: Pod
metadata:
  name: job-a-0
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: job-a
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: job-b-0
  labels:
    app.kubernetes.io/part-of: gang-demo
    job: job-b
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
