# KubeSchedulerConfiguration topology-aware placement demo.
# Filler pods pinned to nodes to create the free-GPU pattern:
#   sched-dev-worker  (rack-1): 3 used, 1 free
#   sched-dev-worker2 (rack-1): 0 used, 4 free
#   sched-dev-worker3 (rack-2): 2 used, 2 free
---
apiVersion: v1
kind: Pod
metadata:
  name: filler-rack1
  labels:
    app.kubernetes.io/part-of: topology-demo
    job: filler
spec:
  nodeSelector:
    kubernetes.io/hostname: sched-dev-worker
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: filler-rack2
  labels:
    app.kubernetes.io/part-of: topology-demo
    job: filler
spec:
  nodeSelector:
    kubernetes.io/hostname: sched-dev-worker3
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
