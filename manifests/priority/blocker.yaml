# Blocker: 3 Pods x 4 GPUs, all 12 GPUs. It runs at gpu-high so that neither
# gang can preempt it: preemption only evicts Pods of strictly lower priority.
apiVersion: v1
kind: Pod
metadata:
  name: blocker-0
  labels:
    app.kubernetes.io/part-of: priority-demo
    job: blocker
spec:
  priorityClassName: gpu-high
  terminationGracePeriodSeconds: 5
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 4
