# Low-priority plain Pods: the same 4 Pods x 2 GPUs at gpu-low, but with no
# PodGroup, so the scheduler can preempt them one at a time.
apiVersion: v1
kind: Pod
metadata:
  name: low-plain-0
  labels:
    app.kubernetes.io/part-of: priority-demo
    job: low-plain
spec:
  priorityClassName: gpu-low
  terminationGracePeriodSeconds: 5
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
---
