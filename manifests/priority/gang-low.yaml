# Low-priority gang: 4 Pods x 2 GPUs (8 GPUs), gang minCount 4, priority
# gpu-low, disruptionMode all (preempted only as a whole group).
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: low-job
  labels:
    app.kubernetes.io/part-of: priority-demo
spec:
  podGroupTemplates:
    - name: workers
      priorityClassName: gpu-low
      disruptionMode:
        all: {}
      schedulingPolicy:
        gang:
          minCount: 4
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: low-job-workers
  labels:
    app.kubernetes.io/part-of: priority-demo
spec:
  workloadRef:
    workloadName: low-job
    templateName: workers
  priorityClassName: gpu-low
  # Evict the whole group together if it is preempted, never a subset.
  disruptionMode:
    all: {}
  schedulingPolicy:
    gang:
      minCount: 4
---
apiVersion: v1
kind: Pod
metadata:
  name: low-job-0
  labels:
    app.kubernetes.io/part-of: priority-demo
    job: low-job
spec:
  priorityClassName: gpu-low
  schedulingGroup:
    podGroupName: low-job-workers
  terminationGracePeriodSeconds: 5
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          nvidia.com/gpu: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: low-job-1
  labels:
    app.kubernetes.io/part-of: priority-demo
